[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "summer-pseudonymizer"
version = "0.1.0"
description = "Dansk pseudonymisering af tekst med faste tokens, lækagevagt og evaluering (valgfrit med Presidio)"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# Valgfrit NER-lag. Den danske spaCy-model installeres for sig selv (se docs/PRESIDIO.md).
presidio = ["presidio-analyzer>=2.2", "spacy>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
